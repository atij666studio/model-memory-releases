# Builds Model Memory for Windows, macOS (universal: Apple Silicon + Intel) and Linux from the
# private source repo, and (optionally) publishes the installers as a GitHub Release here.
# Formats: VST3, CLAP, LV2, Standalone (+ AU on macOS).
#
# Run it: Actions tab > build > Run workflow, or locally:
#   gh workflow run build -R atij666studio/model-memory-releases -f ref=main -f release=true
#
# The source is fetched with a read-only deploy key (secret SOURCE_DEPLOY_KEY); it is compiled
# here but never uploaded. Only installers and portable zips are published.
name: build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Source branch, tag or commit to build"
        default: "main"
      release:
        description: "Publish a GitHub Release with the installers"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      ver: ${{ steps.v.outputs.ver }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: atij666studio/model-memory
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout: cpp/CMakeLists.txt
          sparse-checkout-cone-mode: false
      - id: v
        run: echo "ver=$(sed -n 's/^project(ModelMemory VERSION \([0-9.]*\).*/\1/p' cpp/CMakeLists.txt)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, name: Windows }
          - { os: macos-15, name: macOS }
          - { os: ubuntu-22.04, name: Linux }
    runs-on: ${{ matrix.os }}
    env:
      VER: ${{ needs.version.outputs.ver }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: atij666studio/model-memory
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libgl1-mesa-dev ninja-build

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then GEN="-G Ninja"; else GEN=""; fi
          cmake -S cpp -B build $GEN -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          TARGETS="ModelMemory_VST3 ModelMemory_CLAP ModelMemory_LV2 ModelMemory_Standalone mm_render"
          if [ "$RUNNER_OS" = "macOS" ]; then TARGETS="$TARGETS ModelMemory_AU"; fi
          cmake --build build --config Release --parallel 4 --target $TARGETS

      - name: Package (portable zip)
        shell: bash
        run: |
          bash scripts/package.sh build "ModelMemory-${{ matrix.name }}"
          mkdir -p out && mv "ModelMemory-${{ matrix.name }}.zip" "out/ModelMemory-$VER-${{ matrix.name }}.zip"

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Q "/DSrc=..\..\ModelMemory-Windows" "/DAppVersion=$env:VER" installer\windows\ModelMemory.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item "dist\ModelMemory-$env:VER-Windows-Setup.exe" out\

      - name: Installer (macOS)
        if: runner.os == 'macOS'
        run: bash installer/macos/build_pkg.sh ModelMemory-macOS "$VER" "out/ModelMemory-$VER-macOS.pkg"

      - name: Installer (Linux)
        if: runner.os == 'Linux'
        run: bash installer/linux/build_deb.sh ModelMemory-Linux "$VER" "out/model-memory_${VER}_amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: ModelMemory-${{ matrix.name }}
          path: out/*

  release:
    if: inputs.release
    needs: [version, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.ver }}
          name: Model Memory ${{ needs.version.outputs.ver }}
          body: |
            Free download. Pick the installer for your system:

            | System | Installer | Formats |
            |---|---|---|
            | Windows 10/11 (64-bit) | `ModelMemory-${{ needs.version.outputs.ver }}-Windows-Setup.exe` | VST3, CLAP, LV2, Standalone |
            | macOS 10.13+ (Apple Silicon + Intel) | `ModelMemory-${{ needs.version.outputs.ver }}-macOS.pkg` | VST3, AU, CLAP, LV2, Standalone |
            | Linux (Debian/Ubuntu) | `model-memory_${{ needs.version.outputs.ver }}_amd64.deb` | VST3, CLAP, LV2, Standalone |

            Other Linux distributions: download the Linux zip, unzip and run `./install.sh`.
            The zips are portable copies of everything (plugins, app, manual, demo models, trainer).

            macOS: the build is not notarised. If macOS blocks it, right-click > Open, or run
            `xattr -dr com.apple.quarantine "/Applications/Model Memory.app"`.
          files: artifacts/*/*
